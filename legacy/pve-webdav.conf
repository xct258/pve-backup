# WebDAV 备份上传配置
# 修改后无需重启，下一次备份任务生效

# rclone remote 名称（对应 /root/.config/rclone/rclone.conf 中的 [name]）
RCLONE_REMOTE=webdav

# 远端存放备份的子目录（相对于 remote 根目录）
REMOTE_SUBDIR=dav/pve-backup

# 远端保留时长，例如 7d / 30d / 2w；留空表示不清理
RETENTION=7d

# 上传并校验成功后是否删除本地备份文件（1=删除，0=保留）
DELETE_LOCAL=0

# rclone 重试次数与单次传输超时
RCLONE_RETRIES=5
RCLONE_TIMEOUT=10m
