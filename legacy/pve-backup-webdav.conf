# PVE 备份 + WebDAV 上传配置
# 修改后下一次执行生效，无需重启服务

# ---------- 备份参数 ----------
# 要备份的 VMID，多个用空格分隔；填 all 表示全部
VMIDS="100"

# PVE 存储 ID（备份文件会落到该存储）
STORAGE="local"

# 备份模式：snapshot / suspend / stop
BACKUP_MODE="snapshot"

# 压缩算法：zstd / gzip / lzo / 0
COMPRESS="zstd"

# 本地保留策略（由 vzdump 自己执行）
LOCAL_PRUNE="keep-last=3"

# 本地备份目录（与 STORAGE=local 对应）
DUMPDIR="/var/lib/vz/dump"

# ---------- WebDAV 参数 ----------
# rclone remote 名称，对应 /root/.config/rclone/rclone.conf
RCLONE_REMOTE="webdav"

# 远端子目录
REMOTE_SUBDIR="dav/pve-backup"

# 远端保留时长，例如 7d / 30d；留空表示不清理
# 注意：清理需要 OpenList 用户的「允许删除」权限
REMOTE_RETENTION="7d"

# ---------- 行为开关 ----------
# 上传校验通过后删除本地文件（1=删除，0=保留）
DELETE_LOCAL=0

# 是否额外做 SHA256 校验（1=开启；会额外下载一遍远端文件）
VERIFY_HASH=0

# 上传失败时服务是否返回失败（1=返回非 0，便于 systemd 告警）
UPLOAD_FAILURE_FATAL=1

# ---------- rclone 传输 ----------
RCLONE_RETRIES=5
RCLONE_TIMEOUT=10m
